name: Deploy Frontend to Cloudflare Pages

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  verify-quality:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check code quality status
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            try {
              const workflows = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                event: 'pull_request',
                branch: context.payload.pull_request.head.ref
              });
              
              const qualityCheck = workflows.data.workflow_runs.find(run => 
                run.name === 'Code Quality Check' && 
                run.head_sha === context.payload.pull_request.head.sha
              );
              
              if (!qualityCheck) {
                core.setFailed('Could not find code quality check run');
                return;
              }
              
              if (qualityCheck.conclusion !== 'success') {
                core.setFailed(`Code quality check failed with status: ${qualityCheck.conclusion}`);
                return;
              }
              
              console.log('Code quality check passed successfully');
            } catch (error) {
              core.setFailed(`Error checking code quality status: ${error.message}`);
            }

  deploy:
    needs: verify-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          cd frontend
          bun install

      - name: Build
        run: |
          cd frontend
          bun run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: yusukenakanishicom
          directory: frontend/dist
          branch: main