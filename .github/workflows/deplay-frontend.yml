name: Deploy Frontend to Cloudflare Pages

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  verify-quality:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check code quality status
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            const workflows = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: 'pull_request',
              branch: 'main'
            });
            
            const qualityCheck = workflows.data.workflow_runs.find(run => 
              run.name === 'Code Quality Check' && 
              run.head_sha === context.payload.pull_request.head.sha
            );
            
            if (!qualityCheck || qualityCheck.conclusion !== 'success') {
              core.setFailed('Code quality checks must pass before deployment');
            }

  deploy:
    needs: verify-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          cd frontend
          bun install

      - name: Build
        run: |
          cd frontend
          bun run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: your-project-name
          directory: frontend/dist
          branch: main