name: Code Quality

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'biome.json'
      - '.github/workflows/code-quality.yml'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: changes
        run: |
          echo "frontend=$(git diff --name-only HEAD^ HEAD | grep -q '^frontend/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "backend=$(git diff --name-only HEAD^ HEAD | grep -q '^backend/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Print change status
        run: |
          if [[ $(git diff --name-only HEAD^ HEAD | grep -q '^frontend/' && echo 'true' || echo 'false') == 'true' ]]; then
            echo "🔍 Frontend changes detected"
          else
            echo "⏭️ No frontend changes - lint check will be skipped"
          fi
          
          if [[ $(git diff --name-only HEAD^ HEAD | grep -q '^backend/' && echo 'true' || echo 'false') == 'true' ]]; then
            echo "🔍 Backend changes detected"
          else
            echo "⏭️ No backend changes - lint check will be skipped"
          fi

  frontend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('frontend/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-frontend-

      - name: Install dependencies
        working-directory: ./frontend
        run: bun install

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run frontend checks
        run: biome check ./frontend/src

  backend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-backend-${{ hashFiles('backend/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-backend-

      - name: Install dependencies
        working-directory: ./backend
        run: bun install

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run backend checks
        run: biome check ./backend/src

  summary:
    needs: [detect-changes, frontend-lint, backend-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print workflow summary
        run: |
          echo "### Lint Check Summary 📊" >> $GITHUB_STEP_SUMMARY
          
          if [[ '${{ needs.detect-changes.outputs.frontend }}' == 'true' ]]; then
            if [[ '${{ needs.frontend-lint.result }}' == 'success' ]]; then
              echo "- ✅ Frontend lint check passed" >> $GITHUB_STEP_SUMMARY
            elif [[ '${{ needs.frontend-lint.result }}' == 'failure' ]]; then
              echo "- ❌ Frontend lint check failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⚠️ Frontend lint check skipped or canceled" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⏭️ Frontend lint check skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ '${{ needs.detect-changes.outputs.backend }}' == 'true' ]]; then
            if [[ '${{ needs.backend-lint.result }}' == 'success' ]]; then
              echo "- ✅ Backend lint check passed" >> $GITHUB_STEP_SUMMARY
            elif [[ '${{ needs.backend-lint.result }}' == 'failure' ]]; then
              echo "- ❌ Backend lint check failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⚠️ Backend lint check skipped or canceled" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⏭️ Backend lint check skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          fi