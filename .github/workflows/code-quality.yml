name: Code Quality Check

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # PRにコメントを付けるための権限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          cd frontend
          bun install

      - name: Run Lint
        id: lint
        run: |
          cd frontend
          bun run lint
        continue-on-error: true  # エラーがあってもジョブを続行

      - name: Comment PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const lintOutcome = steps.lint.outcome;
            const message = lintOutcome === 'success' 
              ? '✅ Code quality checks passed!' 
              : '❌ Code quality checks failed. Please fix the issues.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: message
            });